# USB tethering (Pixel and similar). ue0 and ue1, and any later ueN,
# are started when the interface appears and again when the link is up.
# dhclient(8) is called directly so a second phone does not need its
# own ifconfig_ueN line before the first hotplug.
notify 100 {
	match "system"		"IFNET";
	match "subsystem"	"ue[0-9]+";
	match "type"		"ATTACH";
	action "/sbin/ifconfig $subsystem up && /sbin/dhclient -b $subsystem";
};

notify 100 {
	match "system"		"IFNET";
	match "subsystem"	"ue[0-9]+";
	match "type"		"LINK_UP";
	action "/sbin/dhclient -b $subsystem";
};
